[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "qodpolicylab"
version = "0.1.0"
description = "Offline counterfactual QoD policy research simulator"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
qodpolicylab = "qodpolicylab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]